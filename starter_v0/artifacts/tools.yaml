# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Tool duy nhất được phép dùng cho yêu cầu IT còn thiếu ID, giá trị không khớp enum, hoặc ticket chưa được xác nhận. Với ticket ban đầu, dùng ngay summary/priority/asset_id đã có để hỏi yes_no, không hỏi thêm mô tả không bắt buộc. Với enum không hợp lệ, hỏi choice chỉ gồm các giá trị hợp lệ. Không dùng ngoài phạm vi."
    parameters:
      type: object
      properties:
        question: { type: string, default: "", description: "Câu hỏi" }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "Kiểu trả lời",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Chỉ gồm các giá trị hợp lệ trong enum liên quan; không thêm giá trị không hợp lệ do người dùng nêu",
          }
      required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Nội dung cần tìm" }
        category:
          {
            type: string,
            enum:
              [
                all,
                vpn,
                email,
                wifi,
                printing,
                account,
                security,
                hardware,
                software,
                meeting_room,
              ],
            default: "all",
            description: "Nhóm hướng dẫn",
          }
        top_k: { type: integer, default: 3, description: "Số kết quả" }
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung. Tool chỉ khả dụng khi người dùng nói chính xác production/staging hoặc hoàn toàn không nhắc môi trường (khi đó dùng production). Nếu người dùng có nêu bất kỳ nhãn môi trường nào khác, không gọi tool này và bắt buộc dùng clarify choice; không suy diễn nhãn đó thành staging."
    parameters:
      type: object
      properties:
        service:
          {
            type: string,
            enum: [vpn, email, sso, wifi, printing],
            description: "Tên dịch vụ",
          }
        environment:
          {
            type: string,
            enum: [production, staging],
            default: "production",
            description: "Môi trường",
          }
      required: [service, environment]

  - name: inspect_device
    description: "Chẩn đoán đúng một thiết bị khi người dùng yêu cầu kiểm tra và cung cấp asset_id rõ ràng; không dùng employee ID làm asset_id. Chỉ xem danh sách thiết bị được cấp không phải là chẩn đoán và không cần tool này. Chọn check theo hạng mục yêu cầu, hoặc all cho kiểm tra tổng thể."
    parameters:
      type: object
      properties:
        asset_id: { type: string, description: "Mã tài sản" }
        check:
          {
            type: string,
            enum: [all, network, vpn, security, hardware, software],
            default: "all",
            description: "Nhóm kiểm tra",
          }
      required: [asset_id, check]

  - name: lookup_user
    description: "Tra cứu một lần hồ sơ, trạng thái tài khoản và danh sách thiết bị được cấp bằng employee_id rõ ràng. Một kết quả đã cung cấp cả ba nội dung; không gọi lặp và không chẩn đoán thiết bị trừ khi người dùng yêu cầu riêng."
    parameters:
      type: object
      properties:
        employee_id: { type: string, description: "Mã nhân viên" }
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: { type: string }
              detail: { type: string }
              source: { type: string }
              status: { type: string }
        template:
          {
            type: string,
            enum: [brief, technical, handoff],
            default: "brief",
            description: "Mẫu báo cáo",
          }
        incident_title:
          { type: string, default: "IT incident", description: "Tiêu đề" }
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer:
          { type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo" }
        model:
          {
            type: string,
            description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4",
          }
        query_type:
          {
            type: string,
            enum: [specs, drivers, support, compatibility],
            default: "support",
            description: "Loại thông tin cần tìm",
          }
        max_results:
          { type: integer, default: 3, description: "Số kết quả, tối đa 5" }
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Nội dung cần tìm" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                access_control,
                data_privacy,
                external_tools,
                incident_response,
                service_operations,
                ticketing,
              ],
            default: "all",
            description: "Nhóm chính sách",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: create_ticket
    description: "Chỉ hoàn tất bước thứ hai của luồng tạo ticket: assistant đã trình bày payload và hỏi yes_no ngay trước đó, rồi lượt mới nhất của người dùng đồng ý mà không sửa gì. Nếu chưa đủ điều kiện này thì tool không khả dụng và phải dùng clarify yes_no. Không bao giờ gọi với confirmed=false."
    parameters:
      type: object
      properties:
        summary: { type: string, default: "", description: "Tóm tắt sự cố" }
        priority:
          {
            type: string,
            enum: [low, medium, high, critical],
            default: "medium",
            description: "Mức ưu tiên",
          }
        asset_id:
          { type: string, default: "", description: "Mã tài sản nếu có" }
        confirmed:
          {
            type: boolean,
            enum: [true],
            description: "Luôn là true; chỉ hợp lệ sau xác nhận đúng payload ở lượt mới nhất",
          }
      required: [summary, confirmed]
